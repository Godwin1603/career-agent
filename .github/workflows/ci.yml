name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Format check with Black
      run: |
        black --check .
        
    - name: Run tests with pytest
      env:
        # Dummy environment variables to satisfy config validation during testing
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/career_agent
        REDIS_URL: redis://localhost:6379/0
        GCP_PROJECT_ID: test
        GCS_BUCKET_NAME: test
        CLOUD_TASKS_LOCATION: test
        CLOUD_RUN_SERVICE_URL: http://test
        CLOUD_TASKS_QUEUE_JOB_ENRICHMENT: q
        CLOUD_TASKS_QUEUE_PORTAL_APPLICATION: q
        CLOUD_TASKS_QUEUE_FORM_APPLICATION: q
        CLOUD_TASKS_QUEUE_EMAIL_APPLICATION: q
        CLOUD_TASKS_QUEUE_NOTIFICATION: q
        TELEGRAM_API_ID: test
        TELEGRAM_API_HASH: test
        TELEGRAM_SESSION_STRING: test
        TELEGRAM_CHANNEL_ID: 1
        TELEGRAM_NOTIFY_CHAT_ID: 1
        GMAIL_OAUTH_CLIENT_ID: test
        GMAIL_OAUTH_CLIENT_SECRET: test
        GMAIL_OAUTH_REFRESH_TOKEN: test
        GMAIL_SENDER_ADDRESS: test
      run: |
        pytest -v
